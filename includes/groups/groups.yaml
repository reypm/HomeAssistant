# https://www.home-assistant.io/components/group/

## General
all_devices:
  name: All House Devices
  entities:
    # Fans
    - fan.guest_room
    - fan.kid_bedroom
    - fan.family_room
    - fan.master_bedroom
    - fan.home_office

    # Lights
    - light.bathroom_dimmer

    - light.guest_room
    - light.kid_bedroom
    - light.kitchen_first_dimmer_hs220
    - light.kitchen_second_dimmer_hs220
    - light.family_room
    - light.master_bedroom
    - light.home_office
    - light.rgbic_tv_backlight

    # Switches
    - light.bathroom_light #switch.bathroom_light
    - light.dining_room_light #switch.dining_room_light
    - light.dinning_table_light #switch.dinning_table_light

    - light.entrance_light #switch.enttrance_light_hs200

    - light.garage_light #switch.garage_light

    - light.kitchen_light_hs210 #switch.kitchen_light_hs210
    - light.laundry_motion_switch_ks200m #switch.laundry_motion_switch_ks200m
#    - light.outside_light #light.outside_light
    - light.patio_light #switch.patio_fan_light_hs200
    - light.porch_light #switch.porch_lights_hs200
    - light.kid_bedroom_walkin_closet #switch.kid_bedroom_walkin_closet

    # Media Player
    - media_player.fire_tv_living_room
    - media_player.fire_tv_master_bedroom
    - media_player.lg_soundbar_sp9ya
    - media_player.lg_tv_living_room
    - media_player.lg_tv_master_bedroom
