---
# Groups
# https://www.home-assistant.io/components/group/

##Lights
all_lights:
  name: All Home Lights
  entities:
    # Main Bedroom
    - light.bathroom_light # switch.bathroom_light_hs200
    - light.walking_closet
    - light.bathroom_dimmer
    - light.master_light_switch
    # Second Bedroom - Maxi
    - light.kid_bedroom_walkin_closet
    - light.kid_room_light_switch
    # Third Bedroom - Emiliano
    - light.emiliano_room_light_switch
    # Kitchen
    - light.dinning_table_light # switch.kitchen_second_light
    - light.kitchen_first_dimmer
    - light.kitchen_second_dimmer
    - switch.kitchen_light
    # Dinning-Room
    - light.dinning_room_light # switch.dining_room_light_hs200
    # Living-Room
    - light.living_room_light_switch
    # Patio-Pool
    - light.patio_main_light
    - light.patio_light_fan
    - light.pool_light
    # Garage
    - light.garage_light # switch.garage_light
    # Laundry
    - light.laundry_motion_light # switch.laundry_motion_light
    # Office
    - light.smart_switch_office
    - light.office_light_switch
    # Others
    - light.outside_light
    - light.porch_light
    - light.entrance_light # switch.enttrance_light_hs200

##Fans
all_fans:
  name: All Fans
  entities:
    - fan.emiliano_room_fan_switch
    - fan.kid_bedroom_fan_switch
    - fan.living_room_fan_switch
    - fan.master_fan_switch
    - fan.office_fan_switch

# Rack Fans
rack_fans:
  name: Rack Smart Plug
  entities:
    - switch.sp_top_fan_rack_switch
    - switch.sp_bottom_fan_rack_switch_switch

door_windows_sensors:
  name: Sliding Door and Windows Sensors
  entities:
    - binary_sensor.sw_office_right_opening
    - binary_sensor.sw_office_left_opening
    - binary_sensor.sd_master_bedroom_opening
    - binary_sensor.sd_kitchen_opening
