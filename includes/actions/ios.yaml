actions:
  # Family Room Actions
  - name: FR_MEDIA_ON
    background_color: "#000000"
    label:
      text: "FR Media ON"
      color: "#ff0000"
    icon:
      icon: mdi:television
      color: "#ffffff"

  - name: FR_MEDIA_OFF
    background_color: "#000000"
    label:
      text: "FR Media OFF"
      color: "#ff0000"
    icon:
      icon: mdi:television-off
      color: "#ffffff"
  - name: FR_FAN_ON
    background_color: "#000000"
    label:
      text: "FR Fan ON"
      color: "#ff0000"
    icon:
      icon: mdi:fan
      color: "#ffffff"
  - name: FR_FAN_OFF
    background_color: "#000000"
    label:
      text: "FR Fan OFF"
      color: "#ff0000"
    icon:
      icon: mdi:fan-off
      color: "#ffffff"
