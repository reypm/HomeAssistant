###############################################################################
# THE HOME ASSISTANT CONFIGURATION FILE - MOTHER OF ALL CONFIG FILES
###############################################################################

## Core Configuration. Do not remove.
homeassistant:
  name: Home
  latitude: !secret latitude_home
  longitude: !secret longitude_home
  time_zone: "America/New_York"
  elevation: 0
  internal_url: !secret internal_url
  external_url: !secret external_url

energy:

ffmpeg:
stream:

## Packages 123
## https://www.home-assistant.io/docs/configuration/packages/
#packages: !include_dir_named includes/packages

#default_config:
#wake_on_lan:

tts:
  - platform: google_translate

recorder:
  purge_keep_days: 10
  auto_purge: true
  auto_repack: true
  exclude:
    domains:
      - device_tracker
      - media_player
      - uptime
      - time_date
      - worldclock
    entity_globs:
      - sensor.clock*
      - sensor.date*
      - sensor.glances*
      - sensor.load_*m
      - sensor.time*
      - sensor.uptime*
    #entities:
    #  - camera.front_door
    #  - sensor.home_assistant_v2_db
    #  - sensor.memory_free
    #  - sensor.memory_use
    #  - sensor.memory_use_percent
    #  - sensor.processor_use
    #  - weather.openweathermap

# see: https://github.com/allangood/rtlamr2mqtt#home-assistant-utility-meter-configuration-sample
utility_meter:
  hourly_water:
    source: sensor.water_meter_reading
    name: Hourly Water
    cycle: hourly
  daily_water:
    source: sensor.water_meter_reading
    name: Daily Water
    cycle: daily
  monthly_water:
    source: sensor.water_meter_reading
    name: Monthly Water
    cycle: monthly

  hourly_energy:
    source: sensor.electricity_meter
    name: Hourly Energy
    cycle: hourly
  daily_energy:
    source: sensor.electricity_meter
    name: Daily Energy
    cycle: daily
  monthly_energy:
    source: sensor.electricity_meter
    name: Monthly Energy
    cycle: monthly

template:
  - sensor:
      - name: "Water Meter Total Gallons"
        unique_id: water_meter_total_gallons
        unit_of_measurement: "gal"
        device_class: water
        state_class: total_increasing
        state: >
          {% if states('sensor.water_meter_total_increase') not in ['unknown', 'unavailable', 'none'] %}
            {{ (states('sensor.water_meter_total_increase') | float * 264.172) | round(2) }}
          {% else %}
            0
          {% endif %}
