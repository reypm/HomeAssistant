utility_meter:
  hourly_energy:
    source: sensor.energy_meter
    cycle: hourly
  daily_energy:
    source: sensor.energy_meter
    cycle: daily
  monthly_energy:
    source: sensor.energy_meter
    cycle: monthly

  hourly_water:
    source: sensor.water_meter
    cycle: hourly
  daily_water:
    source: sensor.water_meter
    cycle: daily
  monthly_water:
    source: sensor.water_meter
    cycle: monthly
