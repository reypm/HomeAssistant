title: Patio
path: patio_view
icon: mdi:pool
type: custom:horizontal-layout
layout:
  max_cols: 2
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: light.patio_lights
        content: >
          {{ expand(states.group.patio_lights) | selectattr('state', 'eq', 'on') | list | count }}
        icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
        icon: mdi:lightbulb
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Lights On
              content:
                type: custom:auto-entities
                filter:
                  include:
                    - group: group.patio_lights
                      state: "on"
                      options:
                        type: custom:mushroom-light-card
                        show_brightness_control: true
                        layout: horizontal
                        tap_action:
                          action: toggle
                        use_light_color: true
                    - entity_id: group.patio_lights
                      state: "on"
                      options:
                        type: custom:mushroom-light-card
                        layout: horizontal
                        secondary_info: none
                        tap_action:
                          action: toggle
                        card_mod:
                          style: |
                            ha-card {
                              background: color-mix(in srgb, rgb(var(--rgb-state-light)) 10%, var(--card-background-color));
                            }
                            :host {
                              margin: 0px 0px 12px !important;
                            }
                  exclude: []
                card:
                  type: custom:layout-card
                  cards: []
                  layout_type: masonry
                sort:
                  method: friendly_name
              card_mod:
                style: |
                  .content {
                    margin: -24px -16px -24px -16px !important;
                    --ha-card-border-width: 0;
                    --ha-card-background: none;
                    --ha-card-box-shadow: 0;
                    --masonry-view-card-margin: -12px 0px 0px 0px;
                  }
    alignment: end
    card_mod:
      style:
        .: |
          ha-card {
            --chip-box-shadow: none;
            --chip-background: none;
            --chip-border-width: 0;
          }


