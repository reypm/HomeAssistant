  # Tv
  - type: grid
    square: false
    columns: 1
    cards:
      - type: custom:android-tv-card
        remote_id: remote.kid_room_58s470g
        media_player_id: media_player.kid_room_58s470g
        title: Remote
        rows:
          - - back
            - power
            - home
          - - keyboard
            - search
            - volume_slider
          - - - netflix
              - null
              - youtube
              - null
              - spotify
            - navigation_touchpad
          - - previous
            - play_pause
            - next
      - type: custom:stack-in-card
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.kid_room_58s470g
            icon: mdi:play
            use_media_info: true
            use_media_artwork: false
            show_volume_level: false
            media_controls:
              - play_pause_stop
              - previous
              - next
            volume_controls:
              - volume_buttons
              - volume_set
            fill_container: false
            card_mod:
              style: |
                mushroom-shape-icon {
                  {% set media_type = state_attr(config.entity, 'media_content_type') %}
                  --card-mod-icon: 
                  {% if media_type == 'tvshow' %}
                    mdi:television-classic
                  {% elif media_type == 'movie' %}
                    mdi:movie-open
                  {% elif media_type == 'music' %}
                    mdi:music
                  {% elif media_type == 'playlist' %}
                    mdi:music
                  {% else %}
                    mdi:play
                  {% endif %};   
                }
          - type: conditional
            conditions:
              - entity: media_player.kid_room_58s470g
                state_not: "off"
              - entity: media_player.kid_room_58s470g
                state_not: idle
            card:
              entity: media_player.kid_room_58s470g
              hide:
                icon: true
                name: true
                runtime: true
                source: true
                power: true
                state_label: true
                volume: true
                info: true
                progress: false
                controls: true
              more_info: false
              type: custom:mini-media-player
              toggle_power: false
              group: true
              card_mod:
                style:
                  mmp-progress$: |
                    paper-progress {
                      {{ '--paper-progress-container-color: rgba(63, 81, 181, 0.2) !important;' if is_state(config.entity, 'playing') }}
                    }
                  .: |
                    ha-card {
                      margin: 0px 12px 12px;
                      --mmp-progress-height: 42px !important;
                      height: var(--mmp-progress-height);
                      --mmp-accent-color: rgb(63, 81, 181);
                      --ha-card-border-radius: 12px;
                    }
        card_mod:
          style: |
            ha-card {
              {% if not is_state('media_player.kid_room_58s470g', 'off') and not is_state('media_player.kid_room_58s470g', 'idle') %}
                background: url( '{{ state_attr("media_player.kid_room_58s470g", "entity_picture") }}' ), linear-gradient(to left, transparent, rgb(var(--rgb-card-background-color)) 50%);

                {% if state_attr('media_player.kid_room_58s470g', 'media_content_type') == 'tvshow' %}
                  background-size: auto 100%, cover;
                {% else %}
                  background-size: 50% auto, cover;
                {% endif %}

                background-position: right;
                background-repeat: no-repeat;
                background-blend-mode: saturation;
              {% endif %}
            }
