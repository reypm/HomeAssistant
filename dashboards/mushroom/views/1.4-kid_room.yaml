title: Kid Room
path: kid_room
icon: mdi:teddy-bear
type: custom:horizontal-layout
layout:
  max_cols: 1
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: light.kid_room_lights
        content: >
          {{ expand(states.group.kid_room_lights) | selectattr('state', 'eq', 'on') | list | count }}
        icon_color: "{{ 'amber' if is_state(entity, 'on') else 'grey' }}"
        icon: mdi:lightbulb
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Lights On
              content:
                type: custom:auto-entities
                filter:
                  include:
                    - group: group.kid_room_lights
                      state: "on"
                      options:
                        type: custom:mushroom-light-card
                        show_brightness_control: true
                        layout: horizontal
                        tap_action:
                          action: toggle
                        use_light_color: true
                    - entity_id: group.kid_room_lights
                      state: "on"
                      options:
                        type: custom:mushroom-light-card
                        layout: horizontal
                        secondary_info: none
                        tap_action:
                          action: toggle
                        card_mod:
                          style: |
                            ha-card {
                              background: color-mix(in srgb, rgb(var(--rgb-state-light)) 10%, var(--card-background-color));
                            }
                            :host {
                              margin: 0px 0px 12px !important;
                            }
                  exclude: []
                card:
                  type: custom:layout-card
                  cards: []
                  layout_type: masonry
                sort:
                  method: friendly_name
              card_mod:
                style: |
                  .content {
                    margin: -24px -16px -24px -16px !important;
                    --ha-card-border-width: 0;
                    --ha-card-background: none;
                    --ha-card-box-shadow: 0;
                    --masonry-view-card-margin: -12px 0px 0px 0px;
                  }
    alignment: end
    card_mod:
      style:
        .: |
          ha-card {
            --chip-box-shadow: none;
            --chip-background: none;
            --chip-border-width: 0;
          }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: switch.kid_bedroom_smart_outlet_1
        name: AppleTv/SamsungTv Outlet
        tap_action:
          action: toggle
        double_tap_action:
          action: none
        fill_container: true
        #layout: vertical

      - type: custom:mushroom-entity-card
        entity: switch.kid_bedroom_smart_outlet_2
        name: Nintendo Switch OLED Outlet
        tap_action:
          action: toggle
        double_tap_action:
          action: none
        fill_container: true
        #layout: vertical

  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-light-card
        entity: light.kid_bedroom
        fill_container: true
        show_brightness_control: true
        layout: horizontal
        name: Light
      - type: custom:mushroom-fan-card
        entity: fan.kid_bedroom
        fill_container: true
        layout: horizontal
        icon_animation: true
        show_percentage_control: true
        name: Fan
      - type: custom:mushroom-light-card
        entity: light.kid_bedroom_walkin_closet
        fill_container: true
        layout: horizontal
        name: Walking Closet

  - type: custom:webrtc-camera
    url: !secret tapo_camera_stream
    muted: true
    background: true
    mode: webrtc,mse,mp4,mjpeg

  - type: custom:mini-media-player
    entity: media_player.kid_echo
    name: Echo Show 5
    icon: phu:echo-show-5-gen-2
    artwork: full-cover
    tts:
      platform: alexa
      entity_id: media_player.kid_echo

  # remote.58s470g
  - type: custom:mini-media-player
    entity: media_player.58s470g
    icon: phu:lg-oled55
    name: TCL 58S470G
    sound_mode: full
    volume_step: 5
    max_volume: 30
    min_volume: 14
    card_mod:
      style: |
        ha-card {
          padding: 10px;
        }

  # AppleTV (1st Gen)
  - type: custom:mini-media-player
    entity: media_player.atv_kid_bedroom
    icon: phu:apple-tv-box
    artwork: full-cover
    volume_stateless: true
    source: full
    info: scroll
