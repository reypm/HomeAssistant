title: Home Office
path: home-office
icon: mdi:chair-rolling
type: custom:horizontal-layout
layout:
  max_cols: 1
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-light-card
        entity: light.home_office
        fill_container: true
        show_brightness_control: true
        use_light_color: true
        name: Light
      - type: custom:mushroom-fan-card
        entity: fan.home_office
        fill_container: true
        icon_animation: true
        show_percentage_control: true
        name: Fan

  - type: custom:vertical-stack-in-card
    icon: mdi:network
    cards:
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.speedtest_download
            name: Download Speed
          - entity: sensor.speedtest_upload
            name: Upload Speed
          - entity: sensor.speedtest_ping
            name: Ping

  - type: custom:vertical-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.pfsense_cpu_usage
        primary: pfSense CPU Usage
        secondary: |-
          {% set cpu_usage = states('sensor.pfsense_cpu_usage')|float %}
          {{ cpu_usage }} %
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_cpu_status %}
          {{ pfsense_cpu_status() }}
        icon_color: |-
          {% from 'pfsense_tools.jinja' import pfsense_cpu_icon_color %}
          {{ pfsense_cpu_icon_color() }}

      - type: custom:mushroom-template-card
        entity: sensor.pfsense_gateway_wan_dhcp_status
        primary: pfSense Gateway WAN DHCP status
        secondary: |-
          {% from 'pfsense_tools.jinja' import pfsense_status %}
          {{ pfsense_status('sensor.pfsense_gateway_wan_dhcp_status') }}
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_network_icon %}
          {{ pfsense_network_icon('sensor.pfsense_gateway_wan_dhcp_status') }}
        icon_color: >
          {% from 'pfsense_tools.jinja' import pfsense_network_icon_color %}
          {{ pfsense_network_icon_color('sensor.pfsense_gateway_wan_dhcp_status') }}

      - type: custom:mushroom-template-card
        entity: sensor.pfsense_gateway_openvpnif_vpnv4_status
        primary: pfSense Gateway OPENVPNIF_VPNV4 status
        secondary: |-
          {% from 'pfsense_tools.jinja' import pfsense_status %}
          {{ pfsense_status('sensor.pfsense_gateway_openvpnif_vpnv4_status') }}
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_network_icon %}
          {{ pfsense_network_icon('sensor.pfsense_gateway_openvpnif_vpnv4_status') }}
        icon_color: >
          {% from 'pfsense_tools.jinja' import pfsense_network_icon_color %}
          {{ pfsense_network_icon_color('sensor.pfsense_gateway_openvpnif_vpnv4_status') }}

      - type: custom:mushroom-template-card
        entity: sensor.pfsense_interface_wan_status
        primary: pfSense Interface WAN status
        secondary: |-
          {% from 'pfsense_tools.jinja' import pfsense_status %}
          {{ pfsense_status('sensor.pfsense_interface_wan_status') }}
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_network_icon %}
          {{ pfsense_network_icon('sensor.pfsense_interface_wan_status') }}
        icon_color: >
          {% from 'pfsense_tools.jinja' import pfsense_network_icon_color %}
          {{ pfsense_network_icon_color('sensor.pfsense_interface_wan_status') }}

      - type: custom:mushroom-template-card
        entity: sensor.pfsense_interface_openvpnif_status
        primary: pfSense Interface OpenVPNIF status
        secondary: |-
          {% from 'pfsense_tools.jinja' import pfsense_status %}
          {{ pfsense_status('sensor.pfsense_interface_openvpnif_status') }}
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_network_icon %}
          {{ pfsense_network_icon('sensor.pfsense_interface_openvpnif_status') }}
        icon_color: >
          {% from 'pfsense_tools.jinja' import pfsense_network_icon_color %}
          {{ pfsense_network_icon_color('sensor.pfsense_interface_openvpnif_status') }}

      - type: custom:mushroom-template-card
        entity: sensor.pfsense_interface_lan_status
        primary: pfSense Interface LAN status
        secondary: |-
          {% from 'pfsense_tools.jinja' import pfsense_status %}
          {{ pfsense_status('sensor.pfsense_interface_lan_status') }}
        icon: |-
          {% from 'pfsense_tools.jinja' import pfsense_network_icon %}
          {{ pfsense_network_icon('sensor.pfsense_interface_lan_status') }}
        icon_color: >
          {% from 'pfsense_tools.jinja' import pfsense_network_icon_color %}
          {{ pfsense_network_icon_color('sensor.pfsense_interface_lan_status') }}




  - type: grid
    square: false
    columns: 2
    cards:
      - type: gauge
        entity: sensor.smartplug_office_devices_active_power
        name: Current Consumption
        needle: false
        severity:
          green: 100
          yellow: 500
          red: 700
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_office_devices_summation_delivered
            name: Accumulated kWh
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_office_devices_rms_current
            name: RMS Amp
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_office_devices_rms_voltage
            name: RMS Voltage

  - type: grid
    square: false
    columns: 2
    cards:
      - type: gauge
        entity: sensor.smartplug_network_devices_active_power
        name: Current Consumption
        needle: false
        severity:
          green: 100
          yellow: 500
          red: 700
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_network_devices_summation_delivered
            name: Accumulated kWh
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_network_devices_rms_current
            name: RMS Amp
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_network_devices_rms_voltage
            name: RMS Voltage

  - type: custom:stack-in-card
    title: QNAP TS453-D
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.homeofficenas_status
        name: System Status

      - type: custom:mushroom-entity-card
        entity: sensor.homeofficenas_system_temperature
        name: System Temperature

      - type: custom:mushroom-entity-card
        entity: sensor.homeofficenas_cpu_usage
        name: CPU Usage

      - type: custom:mushroom-entity-card
        entity: sensor.homeofficenas_volume_used_datavol
        name: Volume Usage

      - type: custom:mushroom-entity-card
        entity: sensor.homeofficenas_memory_usage
        name: Memory Usage

      - type: custom:mini-graph-card
        name: Network Status
        icon: mdi:network
        entities:
          - entity: sensor.homeofficenas_network_up_eth0
            name: eth0 Up
          - entity: sensor.homeofficenas_network_down_eth0
            name: eth0 Down
          - entity: sensor.homeofficenas_network_up_eth1
            name: eth1 Up
          - entity: sensor.homeofficenas_network_down_eth1
            name: eth1 Down

  - type: custom:vertical-stack-in-card
    title: Canon TR8600 Series
    icon: mdi:nas
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series
        name: Canon TR8600 Series
        fill_container: true
        icon_color: |
          {% if is_state('sensor.canon_tr8600_series', 'idle') %}
            gray
          {%elif is_state('sensor.canon_tr8600_series', 'printing') %}
            red
          {%else%}
            black
          {% endif %}
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series_black_bk
        name: Black Ink Level
        icon: mdi:water-check
        icon_color: black
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series_black_pgbk
        name: Black PGBK Ink Level
        icon: mdi:water-check
        icon_color: black
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series_cyan
        name: Cyan Ink Level
        icon: mdi:water-check
        icon_color: cyan
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series_magenta
        name: Magenta Ink Level
        icon: mdi:water-check
        icon_color: '#FF00FF'
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.canon_tr8600_series_yellow
        name: Yellow Ink Level
        icon: mdi:water-check
        icon_color: yellow
        fill_container: true
        tap_action:
          action: more-info
