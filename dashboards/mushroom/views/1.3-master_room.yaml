title: Master Room
path: master_bedroom
icon: mdi:bed
type: custom:horizontal-layout
layout:
  max_cols: 1
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: light.master_room_lights
        content: >
          {{ expand(states.group.master_room_lights) | selectattr('state', 'eq', 'on') | list | count }}
        icon_color: '{{ ''amber'' if is_state(entity, ''on'') else ''grey'' }}'
        icon: mdi:lightbulb
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Lights On
              content:
                type: custom:auto-entities
                filter:
                  include:
                    - group: group.master_room_lights
                      state: 'on'
                      options:
                        type: custom:mushroom-light-card
                        show_brightness_control: true
                        layout: horizontal
                        tap_action:
                          action: toggle
                        use_light_color: true
                    - entity_id: group.master_room_lights
                      state: 'on'
                      options:
                        type: custom:mushroom-light-card
                        layout: horizontal
                        secondary_info: none
                        tap_action:
                          action: toggle
                        card_mod:
                          style: |
                            ha-card {
                              background: color-mix(in srgb, rgb(var(--rgb-state-light)) 10%, var(--card-background-color));
                            }
                            :host {
                              margin: 0px 0px 12px !important;
                            }
                  exclude: [ ]
                card:
                  type: custom:layout-card
                  cards: [ ]
                  layout_type: masonry
                sort:
                  method: friendly_name
              card_mod:
                style: |
                  .content {
                    margin: -24px -16px -24px -16px !important;
                    --ha-card-border-width: 0;
                    --ha-card-background: none;
                    --ha-card-box-shadow: 0;
                    --masonry-view-card-margin: -12px 0px 0px 0px;
                  }
    alignment: end
    card_mod:
      style:
        .: |
          ha-card {
            --chip-box-shadow: none;
            --chip-background: none;
            --chip-border-width: 0;
          }


  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-light-card
        entity: light.master_bedroom
        fill_container: true
        layout: horizontal
        show_brightness_control: true
        use_light_color: true
        name: Light
      - type: custom:mushroom-fan-card
        entity: fan.master_bedroom
        fill_container: true
        layout: horizontal
        icon_animation: true
        show_percentage_control: true
        name: Fan
      - type: custom:mushroom-light-card
        entity: light.bathroom_dimmer
        fill_container: true
        layout: horizontal
      - type: custom:mushroom-light-card
        entity: light.bathroom_light
        fill_container: true
        layout: horizontal
      - type: custom:mushroom-light-card
        entity: light.walking_closet
        fill_container: true
        layout: horizontal

  - type: custom:mini-media-player
    entity: media_player.lg_tv_master_bedroom
    icon: phu:lg-oled55
    name: LG webOS Smart Tv 55UQ9000PUD
    sound_mode: icon
    max_volume: 90
    min_volume: 10
    toggle_power: true

  - type: custom:mini-media-player
    entity: media_player.fire_tv_master_bedroom
    icon: phu:firetv
    artwork: material
    volume_stateless: true
    source: icon
    sound_mode: icon
    info: scroll
    volume_step: 10
    max_volume: 100
    min_volume: 10
    toggle_power: true

  - type: custom:mini-media-player
    entity: media_player.atv_master_bedroom
    icon: phu:apple-tv-box
    artwork: material
    volume_stateless: true
    source: icon
    sound_mode: icon
    info: scroll
    volume_step: 10
    max_volume: 100
    min_volume: 10
    toggle_power: true

  - type: grid
    square: false
    columns: 2
    cards:
      - type: gauge
        entity: sensor.smartplug_master_bedroom_active_power
        name: Current Consumption
        needle: false
        severity:
          green: 100
          yellow: 500
          red: 700
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_master_bedroom_summation_delivered
            name: Accumulated kWh
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_master_bedroom_rms_current
            name: RMS Amp
          - type: custom:mushroom-entity-card
            entity: sensor.smartplug_master_bedroom_rms_voltage
            name: RMS Voltage