title: Home
path: home_view
icon: mdi:home
type: custom:horizontal-layout
layout:
  max_cols: 2
cards:
  - type: custom:stack-in-card
    cards:
      - type: custom:layout-card
        layout_type: masonry
        layout: { }
        cards:
          - type: custom:mushroom-chips-card
            chips:
              # lock.front_door
              - type: template
                entity: lock.front_door
                icon: >-
                  {{ 'mdi:lock' if is_state('lock.front_door', 'locked') else
                  'mdi:lock-open' }}
                icon_color: '{{ ''green'' if is_state(''lock.front_door'', ''locked'') else ''red'' }}'
                content: null
                tap_action:
                  action: more-info
              # group.all_lights
              - type: conditional
                conditions:
                  - entity: group.all_lights
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:lightbulb
                  content: >-
                    {{ expand(states.group.all_lights) | selectattr( 'state', 'eq', 'on') | list | count }}
                  tap_action:
                    action: more-info
                  entity: group.all_lights
                  icon_color: amber
              # group.all_fans
              - type: conditional
                conditions:
                  - entity: group.all_fans
                    state: 'on'
                chip:
                  type: template
                  icon: mdi:fan
                  content: >-
                    {{ expand(states.group.all_fans) | selectattr( 'state', 'eq', 'on') | list | count }}
                  tap_action:
                    action: more-info
                  entity: group.all_fans
                  icon_color: green
              # group.all_windows
              - type: conditional
                conditions:
                  - entity: group.all_windows
                    state: 'on'
                chip:
                  type: template
                  icon_color: grey
                  icon: mdi:window-open
                  content: >-
                    {{ expand(states.group.all_windows) | selectattr( 'state', 'eq', 'on') | list | count }}
                  tap_action:
                    action: more-info
                  entity: group.all_windows
              # group.external_doors
              - type: conditional
                conditions:
                  - entity: group.external_doors
                    state: 'on'
                chip:
                  type: template
                  icon_color: grey
                  icon: mdi:door-open
                  content: >-
                    {{ expand(states.group.external_doors) | selectattr( 'state',
                    'eq', 'on') | list | count }}
                  tap_action:
                    action: more-info
                  entity: group.external_doors
            card_mod:
              style:
                .: |
                  ha-card {
                    --chip-box-shadow: none;
                    --chip-background: none;
                    --chip-border-width: 0;
                  }
          # person.reynier_perez
          - square: false
            columns: 2
            type: grid
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-chips-card
                    chips:
                      - type: entity
                        entity: person.reynier_perez
                        content_info: name
                        use_entity_picture: true
                        tap_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.popup
                            data:
                              title: Reynier
                              content:
                                type: vertical-stack
                                cards:
                                  - type: custom:mushroom-entity-card
                                    entity: person.reynier_perez
                                    layout: horizontal
                                    icon_type: entity-picture
                                    primary_info: state
                                    secondary_info: last-changed
                                    tap_action:
                                      action: none
                                    hold_action:
                                      action: none
                                    card_mod:
                                      style:
                                        mushroom-shape-avatar$: |
                                          .picture {

                                            /* Style shadow ring around person avatar */
                                            box-shadow: 0px 0px 4px 2px var(--state-person);
                                            margin-right: var(--mush-title-spacing, 12px);
                                          }
                                        .: |
                                          ha-card {

                                            /* Remove default card styling */
                                            --ha-card-background: none;
                                            box-shadow: none;
                                            --ha-card-border-width: 0;

                                            /* Increase icon size */
                                            --icon-size: 72px;

                                            /* Center card */
                                            margin: auto;
                                            width: fit-content;

                                            /* Add padding to bottom of card */
                                            padding: 0px 0px var(--mush-title-spacing, 12px) 0px !important;

                                            /* Make card non-responsive to select and pointer */
                                            user-select: none;
                                            pointer-events: none;

                                            transition: all 0s;
                                          }
                                          :host {

                                            /* Define Person State colors. Can be added to theme */
                                            --state-person-home: var(--green-color);
                                            --state-person-not-home: var(--red-color);
                                            --state-person-zone: var(--blue-color);
                                            --state-person-unknown: var(--grey-color);

                                            /* Set Person State color */
                                            --state-person:
                                            {% if is_state(config.entity, ['home', 'not_home', 'unknown']) %}
                                              var(--state-person-{{ states(config.entity) | replace('_', '-') }})
                                            {% else %}
                                              var(--state-person-zone)
                                            {% endif %};

                                            /* Match styling to Mushroom Title */
                                            --mush-card-primary-font-size: var(--mush-title-font-size, 24px);
                                            --mush-card-primary-font-weight: var(--mush-title-font-weight, normal);
                                            --mush-card-primary-line-height: var(--ush-title-line-height, 1.2);
                                            --mush-card-secondary-font-size: var(--mush-title-font-size, 16px);
                                            --mush-card-secondary-font-weight: var(--mush-title-font-weight, normal);
                                            --mush-card-secondary-line-height: var(--ush-title-line-height, 1.2);
                                          }

                                  - type: history-graph
                                    entities:
                                      - entity: person.reynier_perez
                                        name: ' '
                                    hours_to_show: 24
                                    title: Timeline
                                    card_mod:
                                      style:
                                        $: |
                                          .card-header {

                                            /* Style timeline title */
                                            padding: 0px 24px !important;
                                            font-size: var(--mush-card-primary-font-size, 14px) !important;
                                            font-weight: var(--mush-card-primary-font-weight, bold) !important;
                                            line-height: var(--mush-card-primary-line-height, 1.5) !important;
                                            color: var(--primary-text-color) !important;
                                          }
                                        .: |
                                          ha-card {

                                            /* Remove default card styling */
                                            --ha-card-box-shadow: none;
                                            --ha-card-background: none;
                                            --ha-card-border-width: 0;
                                            user-select: none;
                                          }
                                          .content {

                                            /* Add padding on right */
                                            padding: 0px 24px !important;
                                          }

                                  - type: horizontal-stack
                                    cards:
                                      - type: custom:mushroom-template-card
                                        primary: >-
                                          {{ states(entity) }} {{ state_attr(entity, 'unit_of_measurement') }}
                                        secondary: >
                                          {% set glucose_value = states('sensor.dexcom_glucose_value')|int %}
                                          {% if glucose_value <= 70 %}
                                            Going Low!
                                          {% elif glucose_value > 70 and glucose_value <= 170  %}
                                            Steady!
                                          {% elif glucose_value > 170 %}
                                            Going High!
                                          {% endif %}
                                        icon: mdi:diabetes
                                        entity: sensor.dexcom_glucose_value
                                        layout: vertical
                                        badge_icon: >-
                                          {% set glucose_value = states('sensor.dexcom_glucose_value')|int %}
                                          {% if glucose_value <= 70 %}
                                            mdi:arrow-down
                                          {% elif glucose_value > 70 and glucose_value <= 170  %}
                                            mdi:arrow-right
                                          {% elif glucose_value > 170 %}
                                            mdi:arrow-up
                                          {% endif %}
                                        badge_color: >-
                                          {% set glucose_value = states('sensor.dexcom_glucose_value')|int %}
                                          {% if glucose_value <= 70 %}
                                            red
                                          {% elif glucose_value > 70 and glucose_value <= 170  %}
                                            blue-grey
                                          {% elif glucose_value > 170 %}
                                            amber
                                          {% endif %}
                                        icon_color: red
                                        tap_action:
                                          action: none
                                        hold_action:
                                          action: none
                                        double_tap_action:
                                          action: none
                                        card_mod:
                                          style:
                                            mushroom-state-info$: |
                                              .primary:after {
                                                /* Add destination details */
                                                white-space: pre;
                                                text-overflow: ellipsis;
                                              }
                                            .: |
                                              ha-card {
                                                /* Remove default card styling */
                                                --ha-card-background: none;
                                                --ha-card-box-shadow: none;
                                                --ha-card-border-width: 0;

                                                /* Center card on row */
                                                width: fit-content;
                                                margin: auto;

                                                /* Make card non-responsive to select and pointer */
                                                user-select: none;
                                                pointer-events: none;
                                              }
                                      - type: custom:mushroom-template-card
                                        primary: '{{ states(entity) }}%'
                                        secondary: >
                                          {{ 'charging' if is_state('binary_sensor.iphone_charge_state', 'on' ) else 'discharging' }}
                                        icon: >
                                          {% set battery_level = (states(entity) | int / 10) | round(0) | int * 10 %}

                                          {% if battery_level == 100 %}
                                            mdi:battery
                                          {% elif battery_level > 0 %}
                                            mdi:battery-{{ battery_level }}
                                          {% else %}
                                            mdi:battery-alert-variant-outline
                                          {% endif %}
                                        icon_color: |-
                                          {% set battery_level = states(entity) | int %}
                                          {% if battery_level > 90 %}
                                            green
                                          {% elif battery_level > 60 %}
                                            light-green
                                          {% elif battery_level > 50 %}
                                            lime
                                          {% elif battery_level > 40 %}
                                            yellow
                                          {% elif battery_level > 30 %}
                                            amber
                                          {% elif battery_level > 20 %}
                                            orange
                                          {% elif battery_level > 10 %}
                                            deep-orange
                                          {% else %}
                                            red
                                          {% endif %}
                                        entity: sensor.iphone_battery_level
                                        layout: vertical
                                        badge_icon: >-
                                          {% if is_state('binary_sensor.iphone_charge_state', 'on') %}
                                            mdi:lightning-bolt
                                          {% elif states(entity) | int < 10 %}
                                            mdi:exclamation-thick
                                          {% endif %}
                                        badge_color: >-
                                          {{ 'red' if states(entity) | int < 10 else
                                          'light-blue' }}
                                        tap_action:
                                          action: none
                                        hold_action:
                                          action: none
                                        double_tap_action:
                                          action: none
                                        card_mod:
                                          style:
                                            mushroom-shape-icon$: |
                                              .shape {

                                                /* Radial progress bar */
                                                background: radial-gradient(var(--card-background-color) 60%,
                                                                            transparent calc(60% + 1px)),
                                                            conic-gradient(var(--icon-color) {{ states(config.entity) }}% 0%,
                                                                            var(--card-background-color) 0% 100%);
                                              }
                                              .shape:after {

                                                /* Add back icon shape */
                                                content: "";
                                                height: 100%;
                                                width: 100%;
                                                position: absolute;
                                                border-radius: var(--icon-border-radius);
                                                background: var(--shape-color);
                                              }
                                              ha-icon {

                                                /* Icon charging animation */
                                                {{ '--icon-animation: charge 3s linear infinite;' if is_state('binary_sensor.rhys_phone_is_charging', 'on') }}
                                              }
                                              @keyframes charge {
                                                0%, 80% { clip-path: inset(0 0 0 0); }
                                                10% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 84%, 34% 84%, 34% 100%, 100% 100%, 100% 0%); }
                                                20% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 74%, 34% 74%, 34% 100%, 100% 100%, 100% 0%); }
                                                30% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 64%, 34% 64%, 34% 100%, 100% 100%, 100% 0%); }
                                                40% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 54%, 34% 54%, 34% 100%, 100% 100%, 100% 0%); }
                                                50% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 44%, 34% 44%, 34% 100%, 100% 100%, 100% 0%); }
                                                60% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 34%, 34% 34%, 34% 100%, 100% 100%, 100% 0%); }
                                                70% { clip-path: polygon(0% 0%, 0% 100%, 34% 100%, 34% 24%, 67% 24%, 67% 24%, 34% 24%, 34% 100%, 100% 100%, 100% 0%); }
                                              }
                                            .: |
                                              ha-card {

                                                /* Remove default card styling */
                                                --ha-card-background: none;
                                                --ha-card-box-shadow: none;
                                                --ha-card-border-width: 0;

                                                /* Center card on row */
                                                width: fit-content;
                                                margin: auto;

                                                /* Make card non-responsive to select and pointer */
                                                user-select: none;
                                                pointer-events: none;
                                              }

                                      - type: conditional
                                        conditions:
                                          - entity: sensor.iphone_connection_type
                                            state_not: <not connected>
                                        card:
                                          type: custom:mushroom-template-card
                                          primary: >-
                                            {{ states('sensor.iphone_connection_type') }}
                                          icon: mdi:wifi-arrow-up-down
                                          entity: sensor.iphone_connection_type
                                          layout: vertical
                                          fill_container: false
                                          icon_color: cyan
                                          tap_action:
                                            action: none
                                          hold_action:
                                            action: none
                                          double_tap_action:
                                            action: none
                                          card_mod:
                                            style: |
                                              ha-card {

                                                /* Remove default card styling */
                                                --ha-card-background: none;
                                                --ha-card-box-shadow: none;
                                                --ha-card-border-width: 0;

                                                /* Center card on row */
                                                width: fit-content;
                                                margin: auto;

                                                /* Make card non-responsive to select and pointer */
                                                user-select: none;
                                                pointer-events: none;
                                              }
                                  - type: custom:mushroom-chips-card
                                    chips:
                                      - type: template
                                        tap_action:
                                          action: none;
                                        hold_action:
                                          action: call-service
                                          service: notify.mobile_app_rhys_phone
                                          data:
                                            message: Ringing phone...
                                            title: Find Phone
                                            data:
                                              ttl: 0
                                              importance: high
                                              priority: high
                                              tag: Find
                                              channel: alarm_stream
                                        icon: mdi:target
                                        icon_color: red
                                        content: Find Phone
                                    alignment: center
                                    card_mod:
                                      style: |
                                        ha-card {

                                          /* Style Chip like Mushroom button */
                                          --chip-background: rgba(var(--rgb-red), 0.2);
                                          --chip-border-radius: var(--mush-control-border-radius, 12px);
                                          --chip-height: var(--mush-control-height, 42px);
                                          --chip-box-shadow: none;
                                          user-select: none;
                                        }
                                        ha-card:active {

                                          /* Add effect to give feedback on button press */
                                          --chip-background: rgba(var(--rgb-red), 0.4);
                                        }
                                  - type: map
                                    entities:
                                      - entity: person.reynier_perez
                                    dark_mode: false
                                    hours_to_show: 24
                                    aspect_ratio: '4:3'
                                    default_zoom: 12
                                    card_mod:
                                      style:
                                        ha-map $ ha-entity-marker $: |
                                          .marker {

                                            /* Style person marker & adjust position to avoid blocking waypoints */
                                            border: 3px solid var(--state-person) !important;
                                            border-radius: 50% 50% 50% 0px !important;
                                            transform: rotate(-45deg) translate(50%, -50%);
                                            overflow: visible !important;
                                            background: var(--state-person) !important;
                                          }
                                          .entity-picture {

                                            /* Correct orientation of person avatar */
                                            transform: rotate(45deg);
                                            border-radius: 50%;
                                          }
                                        ha-map $: |
                                          path:first-child {

                                            /* Style accuracy radius */
                                            stroke: var(--state-person);
                                            fill: color-mix(in srgb, var(--state-person) 50%, transparent);
                                            stroke-width: 0px;
                                          }
                                          path:nth-child(even) {

                                            /* Styling for waypoints */
                                            stroke: var(--purple-color);
                                            stroke-width: 4px;
                                          }
                                          path:nth-child(odd):not(:first-child) {

                                            /* Styling for lines */
                                            stroke: var(--purple-color);
                                            stroke-width: 4px;
                                          }

                                          .leaflet-control-attribution {

                                            /* Style attribution text */
                                            background: rgba(var(--rgb-card-background-color), 0.4) !important;
                                            font-size: 10px;
                                          }
                                          .leaflet-container a {

                                            /* Set color of zoom icons & attribution text */
                                            color: var(--secondary-text-color);
                                          }

                                          .leaflet-control-zoom-in,
                                          .leaflet-control-zoom-out {

                                            /* Style zoom buttons like Chips */
                                            border-radius: var(--mush-chip-border-radius, 19px) !important;
                                            padding: 3px;
                                            background: rgb(var(--rgb-secondary-text-color), 0.2) !important;
                                            margin: 8px 12px 0px;
                                            border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color, #e0e0e0)) !important;
                                          }
                                          .leaflet-top {

                                            /* Move zoom buttons to bottom of map */
                                            bottom: 0px !important;
                                          }
                                          .leaflet-control-zoom {

                                            /* Allow buttons to be moved */
                                            position: absolute !important;

                                            /* Adjust spacing for border */
                                            bottom: calc(2 * var(--ha-card-border-width, 1px) + 56px);

                                            /* Remove extra margin */
                                            margin: 0px !important;

                                            /* Remove zoom control border */
                                            border: none !important;
                                          }
                                          .leaflet-container:after {

                                            /* Fade out map at top */
                                            content: "";
                                            position: absolute;
                                            height: 100%;
                                            width: 100%;
                                            background: linear-gradient(to top, transparent 65%, var(--card-background-color));
                                          }
                                        ha-icon-button $ mwc-icon-button $: |
                                          button {

                                            /* Size center button to match Chip */
                                            height: var(--mush-chip-height, 36px) !important;
                                            width: var(--mush-chip-height, 36px) !important;
                                            --mdc-icon-size: 22px;
                                          }
                                        .: |
                                          ha-card {

                                            /* Remove default card styling without affecting child elements */
                                            box-shadow: none;
                                            border-width: 0;
                                            border-radius: 0px 0px var(--ha-card-border-radius, 12px) var(--ha-card-border-radius, 12px);

                                            transition: all 0s;
                                          }
                                          :host {

                                            /* Define Person State colors. Can be added to theme */
                                            --state-person-home: var(--green-color);
                                            --state-person-not-home: var(--red-color);
                                            --state-person-zone: var(--blue-color);
                                            --state-person-unknown: var(--grey-color);

                                            /* Set person state color */
                                            --state-person:
                                            {% if is_state(config.entities[0].entity, ['home', 'not_home', 'unknown']) %}
                                              var(--state-person-{{ states(config.entities[0].entity) | replace('_', '-') }})
                                            {% else %}
                                              var(--state-person-zone)
                                            {% endif %};
                                          }
                                          ha-icon-button {

                                            /* Position center button */
                                            bottom: 12px;
                                            left: 12px !important;
                                            top: auto !important;

                                            /* Style center button to match Chip */
                                            color: var(--deep-orange-color) !important;
                                            background: color-mix(in srgb, var(--deep-orange-color) 20%, transparent);
                                            border-radius: var(--mush-chip-border-radius, 19px);
                                            border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color, #e0e0e0)) !important;
                                          }
                              card_mod:
                                style: |
                                  :host {

                                    /* Remove border from poup */
                                    --popup-padding-x: 0px;
                                    --popup-padding-y: 0px;
                                    --popup-min-width: 450px;
                                  }
                                  .content {

                                    /* Remove extra bottom border */
                                    margin: -18px -24px -24px !important;
                                  }
                        card_mod:
                          style: |
                            ha-card {
                                --chip-background: rgba(var(--rgb-state-person-home), 0.4);
                                margin-top: 5px;
                                margin-bottom: 10px;
                            }
                    card_mod:
                      style: |
                        ha-card { 
                          margin-left: 8px;
                        }
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-chips-card
                    chips:
                      - type: conditional
                        conditions:
                          - entity: person.reynier_perez
                            state_not: home
                        chip:
                          type: entity
                          entity: person.reynier_perez
                          content_info: none
                          use_entity_picture: true
                          card_mod:
                            style: |
                              ha-card {
                                {% if is_state('person.reynier_perez', 'not_home') %}
                                  --chip-background: rgba(var(--rgb-state-person-not-home), 0.4);
                                {% elif is_state('person.reynier_perez', 'unknown') %}
                                  --chip-background: rgba(var(--rgb-state-person-unknown), 0.4);
                                {% else %}
                                  --chip-background: rgba(var(--rgb-state-person-zone), 0.4);
                                {% endif %} 
                                  margin-top: 5px;
                                  margin-bottom: 10px;
                              }
                    alignment: end
                    card_mod:
                      style: |
                        ha-card { 
                          margin-right: 8px;
                        }
          # welcome message
          - type: custom:mushroom-title-card
            title: |-
              {% set time = now().hour %}
              {% if (time >= 18) %} 
               Good Evening, {{user}}!
              {% elif (time >= 12) %}
               Good Afternoon, {{user}}!
              {% elif (time >= 5) %}
               Good Morning, {{user}}!
              {% else %}
               Hello, {{user}}
              {% endif %}
            subtitle: ''
          # weather
          - type: custom:mushroom-template-card
            primary: '{{ state_attr(entity, ''temperature'') | round(1) }} °F'
            secondary: |-
              {% set conditions = {
                    'clear-night': 'Clear, Night',
                    'cloudy': 'Cloudy',
                    'fog': 'Fog',
                    'hail': 'Hail',
                    'lightning': 'Lightning',
                    'lightning-rainy': 'Lightning, Rainy',
                    'partlycloudy': 'Partly Cloudy',
                    'pouring': 'Pouring',
                    'rainy': 'Rainy',
                    'snowy': 'Snowy',
                    'snowy-rainy': 'Snowy, Rainy',
                    'sunny': 'Sunny',
                    'windy': 'Windy',
                    'windy-variant': 'Windy',
                    'exceptional': 'Exceptional'
                  } %}

              {{ conditions[states('weather.home_accu_weather')] }}
            icon: none
            entity: weather.home_accu_weather
            picture: >-
              {% set condition = states(entity)  %}

              {% if condition == 'partlycloudy' and is_state('sun.sun', 'below_horizon') %}
                {% set condition = condition + '-night' %}
              {% endif %}

              /local/weather_icons/anim/{{ condition }}.svg
            tap_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: Weather
                  content:
                    type: custom:layout-card
                    layout_type: masonry
                    layout: { }
                    cards:
                      - type: custom:weather-card
                        entity: weather.home_accu_weather
            card_mod:
              style:
                mushroom-state-info$: |

                  /* Align text on the right */
                  .container {
                    transform: scaleX(-1);
                    text-align: right;
                    width: fit-content;
                  }
                .: |
                  ha-card {

                    /* Move icon to the right */
                    transform: scaleX(-1);

                    /* Enlarge icon & remove circular shape */
                    --icon-size: 42px;
                    --icon-border-radius: 0;

                    /* Style secondary text */
                    --card-secondary-font-weight: normal;

                    /* Remove styling from card */
                    --ha-card-background: none;
                    --ha-card-box-shadow: none;
                    --ha-card-border-width: 0;
                    padding: 0px !important;

                    transition: all 0s;
                  }
    card_mod:
      style: |
        ha-card {
          padding: 2px;
          /*background: rgba(var(--rgb-primary-text-color), 0.01);*/
        }
  # climate.home
  - type: custom:stack-in-card
    keep:
      margin: false
      box_shadow: false
      background: false
    cards:
      - type: grid
        square: false
        columns: 2
        cards:
          - type: custom:mushroom-template-card
            primary: Air Conditioner
            secondary: |
              Currently: {{ states('climate.home')|capitalize}}
            icon: |-
              {% from 'ac_tools.jinja' import ac_icon %}
              {{ ac_icon('climate.home') }}
            icon_color: |
              {% from 'ac_tools.jinja' import ac_icon_color %}
              {{ ac_icon_color('climate.home') }}
            tap_action:
              action: none
            card_mod:
              style:
                hui-vertical-stack-card:
                  $: |
                    hui-grid-card:
                      $: |
                        mushroom-shape-icon:
                          $: |
                            ha-icon {
                            
                              /* Animate icon based on AC mode */
                              {% set mode = states(config.entity) %}
                              --icon-animation:
                              {% if mode == 'heat_cool' %}
                                spin 3s ease-in-out infinite alternate
                              {% elif mode == 'heat' %}
                                heat 1.5s infinite
                              {% elif mode == 'cool' %}
                                cool 6s ease-in-out infinite
                              {% elif mode == 'dry' %}
                                dry 1.5s linear infinite
                              {% elif mode == 'fan_only' %}
                                spin 1s linear infinite
                              {% endif %};
                            }
                            @keyframes cool {
                              0%, 100% { transform: rotate(25deg); }
                              25% { transform: rotate(-25deg); }
                              50% { transform: rotate(50deg); }
                              75% { transform: rotate(-50deg); }
                            }
                            @keyframes heat {
                              50% { opacity: 0.5; }
                            }
                            @keyframes dry {
                              0%, 100% { transform: scale(1); }
                              50% { transform: scale(1.25); }
                            }
          - type: vertical-stack
            cards:
              - type: custom:simple-thermostat
                entity: climate.home
                header:
                  name: false
                  icon: false
                decimals: '0'
                fallback: 'Off'
                hide:
                  temperature: true
                  state: true
                layout:
                  mode:
                    names: false
                    icons: false
                    headings: false
                  step: row
                step_size: '1'
                control:
                  hvac:
                    'off': false
                    heat: false
                    cool: false
                    heat_cool: false
                card_mod:
                  style: |
                    ha-card {
                      /* Remove styling from card */
                      box-shadow: none;
                      border: none;
                      background: none;
                      padding: var(--mush-chip-spacing, 8px);
                      transition: all 0s;
                      --st-spacing: 0px;
                    }
                    ha-card .current--value {
                      color: #000000;
                      font-size: 18pt;
                      font-weight: bold;
                    }


      - type: custom:mushroom-chips-card
        style: |
          ha-card {
            --chip-box-shadow: none;
            --chip-background: none;
          }
        alignment: justify
        chips:
          - type: template
            entity: climate.home
            content: |
              {{ state_attr(entity, 'fan_mode') }}
            icon: mdi:fan
            icon_color: green
            tap_action: none
          - type: template
            content: '{{ states(entity) }}% Home'
            entity: sensor.ewelink_home_humidity
            icon: mdi:water
            icon_color: blue
            tap_action: none
            hold_action: none
            double_tap_action: none
          - type: template
            content: '{{ states(entity) }}% Bedroom'
            entity: sensor.ht_sensor_master_bedroom_humidity
            icon: mdi:water
            icon_color: blue
            tap_action: none
            hold_action: none
            double_tap_action: none
          - type: template
            content: '{{ states(entity) }}% Garage'
            entity: sensor.humidity_temperature_sensor_garage_humidity
            icon: mdi:water
            icon_color: blue
            tap_action: none
            hold_action: none
            double_tap_action: none
      - type: custom:simple-thermostat
        entity: climate.home
        header: false
        setpoints: false
        hide:
          temperature: true
          state: true
        layout:
          mode:
            headings: false
            icons: true
            names: false
          step: row
        control:
          hvac:
            'off':
              name: Power
            heat:
              name: Heat
            cool:
              name: Cool
            heat_cool:
              name: Auto
        card_mod:
          style: |
            ha-card .mode-item {
              --st-spacing: 10px;
              border-radius: 10px;
            }
            ha-card .modes {
              grid-gap: 12px
            }
      # home+sensors temperature
      - type: custom:vertical-stack-in-card
        cards:
          - type: grid
            square: false
            columns: 3
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.ewelink_home_temperature
                primary_info: state
                secondary_info: name
                name: Home
                icon_color: green
              - type: custom:mushroom-entity-card
                entity: sensor.ht_sensor_master_bedroom_temperature
                primary_info: state
                secondary_info: name
                name: Bedroom
                icon_color: blue
              - type: custom:mushroom-entity-card
                entity: sensor.office_temperature
                primary_info: state
                secondary_info: name
                name: Office
                icon_color: orange
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.home_temperature
                name: Home
                color: var(--green-color)
              - entity: sensor.bedroom_temperature
                name: Bedroom
                color: var(--blue-color)
                y_axis: secondary
              - entity: sensor.office_temperature
                name: Office
                color: var(--orange-color)
                y_axis: secondary
            hours_to_show: 24
            line_width: 3
            font_size: 50
            animate: true
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade