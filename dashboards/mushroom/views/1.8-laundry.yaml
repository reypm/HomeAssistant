title: Laundry
path: laundry
icon: mdi:washing-machine
layout:
  max_cols: 1
cards:
  - type: custom:stack-in-card
    cards:
      - type: custom:mushroom-light-card
        entity: switch.laundry_motion_light
        fill_container: true
        layout: horizontal
        show_brightness_control: true
        use_light_color: true
      - type: custom:mushroom-light-card
        entity: light.garage_light
        fill_container: true
        layout: horizontal
        show_brightness_control: true
        use_light_color: true
      - type: custom:mushroom-entity-card
        entity: switch.dryer_power
        show_percentage_control: true
      - type: custom:mushroom-entity-card
        entity: switch.top_load_washer_power

  - type: grid
    square: false
    columns: 2
    cards:
      - type: entities
        title: Dryer
        entities:
          - entity: switch.dryer_power
            name: Power
          - entity: button.dryer_remote_start
            name: Remote Start
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.dryer
          - type: custom:mushroom-entity-card
            entity: sensor.dryer_current_course
          - type: custom:mushroom-entity-card
            entity: binary_sensor.dryer_dry_completed

  - type: grid
    square: false
    columns: 2
    cards:
      - type: entities
        title: Top Load Washer
        entities:
          - entity: switch.top_load_washer_power
            name: Power
          - entity: button.top_load_washer_remote_start
            name: Remote Start
      - type: vertical-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.top_load_washer
          - type: custom:mushroom-entity-card
            entity: sensor.top_load_washer_current_course
          - type: custom:mushroom-entity-card
            entity: binary_sensor.top_load_washer_wash_completed
